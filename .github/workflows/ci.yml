name: CI

on:
  push:
    branches: [main, develop, repo-agentic-improvments]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test & Type Check & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type checking
        run: bun run typecheck

      - name: Lint code
        run: bun run lint

      - name: Dead code & dependency check (knip)
        run: bun run dead-code

      - name: Duplication check (jscpd)
        run: bun run duplication

      - name: Run tests with coverage enforcement
        run: bun run test -- --coverage --coverage.lines=80 --coverage.branches=80 --coverage.functions=80 --coverage.statements=80

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build
