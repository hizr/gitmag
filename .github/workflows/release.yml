name: Release & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  check-version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      version-changed: ${{ steps.check.outputs.version-changed }}
      new-version: ${{ steps.check.outputs.new-version }}
      previous-version: ${{ steps.check.outputs.previous-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Extract version from tag
        id: check
        run: |
          # Extract version from tag (remove 'v' prefix)
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PACKAGE_VERSION=$(bun -e "console.log(require('./package.json').version)")

          echo "Tag version: $TAG_VERSION"
          echo "Package.json version: $PACKAGE_VERSION"

          # Verify versions match (sanity check)
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

          # Get previous version from git history
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --exclude="${GITHUB_REF#refs/tags/}" 2>/dev/null || echo "v0.0.0")
          PREVIOUS_VERSION=${PREVIOUS_TAG#v}

          echo "version-changed=true" >> $GITHUB_OUTPUT
          echo "new-version=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "previous-version=$PREVIOUS_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Version release detected: $PREVIOUS_VERSION → $TAG_VERSION"

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type checking
        run: bun run typecheck

      - name: Lint code
        run: bun run lint

      - name: Dead code check
        run: bun run dead-code

      - name: Duplication check
        run: bun run duplication

      - name: Security audit
        run: bun run audit

      - name: Run tests with coverage enforcement
        run: bun run test -- --coverage --coverage.lines=80 --coverage.branches=80 --coverage.functions=80 --coverage.statements=80

      - name: Build for production
        run: bun run build

      - name: Check dist directory size
        run: |
          DIST_SIZE=$(du -sh dist/ | cut -f1)
          echo "📦 Distribution size: $DIST_SIZE"
          DIST_BYTES=$(du -sb dist/ | cut -f1)
          MAX_BYTES=$((5 * 1024 * 1024))
          if [ $DIST_BYTES -gt $MAX_BYTES ]; then
            echo "❌ Distribution exceeds 5 MB limit!"
            exit 1
          fi
          echo "✅ Distribution size check passed"

  generate-changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    needs: [check-version, quality-gates]
    outputs:
      changelog: ${{ steps.changelog.outputs.content }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Generate changelog with git-cliff
        id: changelog
        run: |
          bunx git-cliff --config cliff-release.toml --strip header > CHANGELOG_ENTRY.md
          CHANGELOG=$(cat CHANGELOG_ENTRY.md)
          # Escape for GitHub Output
          CHANGELOG="${CHANGELOG//'%'/'%25'}"
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"
          echo "content=$CHANGELOG" >> $GITHUB_OUTPUT
          cat CHANGELOG_ENTRY.md

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [check-version, quality-gates, generate-changelog]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build for production
        run: bun run build

      - name: Pack and inspect
        run: |
          bun pm pack
          tar -tzf gitmag-${{ needs.check-version.outputs.new-version }}.tgz | head -20

      - name: Publish to npm registry
        run: bun publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check-version, publish, generate-changelog]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.check-version.outputs.new-version }}
          release_name: Release v${{ needs.check-version.outputs.new-version }}
          body: ${{ needs.generate-changelog.outputs.changelog }}
          draft: false
          prerelease: false
